name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      # both solutions, so the projects the server doesn't use (the command line tool) are built too
      - name: Build
        run: |
          dotnet build -c Release censor-core/src/CensorCore.sln
          dotnet build -c Release beta-censoring/src/BetaCensor.sln
      - name: Test censor-core
        run: dotnet test censor-core/src/CensorCore.Tests/CensorCore.Tests.csproj
      - name: Test the server
        run: dotnet test beta-censoring/src/BetaCensor.Server.Tests/BetaCensor.Server.Tests.csproj

  # the status page front end, built as the release workflow and the Dockerfiles build it
  status-page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Build the status page
        working-directory: beta-censoring/src/BetaCensor.Web.Status/ClientApp
        run: |
          npm ci --no-audit --no-fund
          npm run build

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install ffmpeg and dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg
          pip install -r video/requirements.txt pytest mitmproxy==12.2.3
      - name: Test the proxy
        working-directory: proxy
        run: python -m pytest -q
      - name: Test the video service
        working-directory: video
        run: python -m unittest discover -s tests
