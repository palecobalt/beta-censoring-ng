# Dependency updates, grouped so each ecosystem makes one pull request a month.
version: 2
updates:
  - package-ecosystem: nuget
    directories:
      - /censor-core/src
      - /beta-censoring/src
    schedule:
      interval: monthly
    groups:
      nuget:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /beta-censoring/src/BetaCensor.Web.Status/ClientApp
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /video
    schedule:
      interval: monthly
    groups:
      pip:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directories:
      - /
      - /video
    schedule:
      interval: monthly
    groups:
      docker:
        patterns: ["*"]
