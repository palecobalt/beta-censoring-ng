# Dependency updates, grouped so each ecosystem makes one pull request a month. New major versions of NuGet packages
# come as pull requests of their own: each of them is a porting job to look at separately.
version: 2
updates:
  - package-ecosystem: nuget
    directories:
      - /censor-core/src
      - /beta-censoring/src
    schedule:
      interval: monthly
    groups:
      nuget:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # MediatR 13 and later are no longer under the Apache licence
      - dependency-name: MediatR
        versions: [">=13"]
      # upgraded by hand: the CPU and GPU packages together, with the CUDA version in Dockerfile.gpu and a
      # comparison of the detections before and after
      - dependency-name: "Microsoft.ML.OnnxRuntime*"
      # FusionCache 2 logs every cache operation with its key, and the key is the whole image: needs hashed keys first
      - dependency-name: ZiggyCreatures.FusionCache
        update-types: ["version-update:semver-major"]
      # ImageSharp 4 comes with ImageSharp.Drawing 3, which replaces the drawing API: a port, not an update
      - dependency-name: "SixLabors.ImageSharp*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /beta-censoring/src/BetaCensor.Web.Status/ClientApp
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # the original author's packages: their later alpha versions ask for different versions of each other, and
      # `npm ci` refuses to install them together
      - dependency-name: "@silveredgold/*"
      # their components want exactly this version of the icons
      - dependency-name: "@vicons/ionicons5"
  - package-ecosystem: pip
    directory: /video
    schedule:
      interval: monthly
    groups:
      pip:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directories:
      - /
      - /video
    schedule:
      interval: monthly
    groups:
      docker:
        patterns: ["*"]
    ignore:
      # the CUDA version has to match what ONNX Runtime's GPU build was made for (see Dockerfile.gpu)
      - dependency-name: nvidia/cuda
        update-types: ["version-update:semver-major"]
