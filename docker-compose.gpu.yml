# GPU override for docker-compose.yml. The server's GPU image isn't published, so this builds it:
#   scripts/fetch-models.sh
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
# (or set COMPOSE_FILE=docker-compose.yml:docker-compose.gpu.yml in .env)
services:
  beta-censoring:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    image: beta-censoring-ng-gpu
    environment:
      BCS_Server__UseGpu: "true"
      # model runs on the GPU at once; more than 1 caused "CUDA failure 716" errors under load
      BCS_Server__GpuMaxConcurrentRuns: "1"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              # GPU index or UUID from `nvidia-smi -L`; set GPU_DEVICE_ID in .env on multi-GPU hosts
              device_ids: ["${GPU_DEVICE_ID:-0}"]
              capabilities: [gpu]

  # NVENC encoding on the same GPU: the ordinary image, given the GPU. Its log says which encoder it uses.
  video-censor:
    environment:
      NVIDIA_DRIVER_CAPABILITIES: compute,video,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_DEVICE_ID:-0}"]
              capabilities: [gpu, compute, utility, video]
