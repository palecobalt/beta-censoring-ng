# Copy to config.yml next to the server, or mount it at /app/config.yml in Docker.
# Environment variables (BCS_ prefix, e.g. BCS_ModelPath) override these values.

# ModelPath: /app/models/640m.onnx

Server:
  WorkerCount: 4            # about half your CPU cores
  OptimizationMode: Normal  # None skips the person-cropping pre-pass
  # Port: 2382
  # ListenAddress: localhost  # only this computer can connect; "*" lets other machines on your network in.
  #                           # The server has no authentication: anyone who can reach the port can use it.
  # AllowedOrigins: []        # web pages allowed to call the server, e.g. ["https://my-gallery.example"];
  #                           # "*" allows any page, which is unsafe
  # AllowedExtensions: []     # browser extensions allowed to call the server, by id (from the browser's
  #                           # extensions page); empty allows every extension
  # AllowedHosts: []          # names the server is reached by, if not localhost, an IP address, a name without
  #                           # dots or a .local name, e.g. ["censor.example.org"]
  # EnableDiscovery: false    # announce the server on your network over mDNS (with a ListenAddress other than localhost)

# v3 defaults shown; lower values censor more readily
MatchOptions:
  MinimumScore: 0.35
  ClassScores:
    EXPOSED_BREAST_F: 0.3
    EXPOSED_GENITALIA_F: 0.3
    EXPOSED_BREAST_M: 0.3
    EXPOSED_GENITALIA_M: 0.3
    COVERED_BREAST_F: 0.45
    COVERED_GENITALIA_F: 0.45

CensorOptions:
  RelativeCensorScale: 1.0   # enlarge every censored area (1.3 = 30% bigger)
  MergeOverlapping: false    # merge overlapping boxes of any body part that use the same censor type
  MergeDistance: 0.0         # also merge boxes this close, as a fraction of box size (0.1 = 10%)
  CensorAnimatedImages: true         # censor every frame of animated GIFs and WebP (false = first frame only;
                                     # the old name CensorAnimatedGifs still works)
  AnimationDetectionIntervalMs: 200  # run the model on a frame this often; frames in between reuse nearby boxes
  AnimationMaxFrames: 500            # animations with more frames are censored as a still image

Caching:
  EnableMatchCaching: true
  EnableCensoringCaching: false
